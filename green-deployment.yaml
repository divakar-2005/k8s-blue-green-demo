apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bg-demo
      version: green
  template:
    metadata:
      labels:
        app: bg-demo
        version: green
    spec:
      containers:
      - name: web
        image: bg-demo:green
        imagePullPolicy: Never
        ports:
        - containerPort: 80
