apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bg-demo
      version: blue
  template:
    metadata:
      labels:
        app: bg-demo
        version: blue
    spec:
      containers:
      - name: web
        image: bg-demo:blue
        imagePullPolicy: Never
        ports:
        - containerPort: 80
